[project]
name = "hello-agentcontrol-python"
version = "0.1.0"
description = "Hello LaunchDarkly for Python Agent Control SDK"
requires-python = ">=3.12"
dependencies = [
  "launchdarkly-ai-python[otel]>=0.1.8",
  "launchdarkly-server-sdk>=9.18",
  "launchdarkly-ai-openai-messages>=0.2.3",
  "launchdarkly-ai-openai-agents>=0.2.4",
  "launchdarkly-ai-claude-messages>=0.2.3",
  "launchdarkly-ai-claude-agents>=0.2.4",
  "launchdarkly-ai-langchain-messages>=0.2.3",
  "launchdarkly-ai-langchain-agents>=0.2.4",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/launchdarkly/hello-agentcontrol-python"
Repository = "https://github.com/launchdarkly/hello-agentcontrol-python"

[tool.uv]
package = false
